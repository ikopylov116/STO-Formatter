[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sto-formatter"
version = "0.1.0"
description = "Desktop DOCX formatter and checker for STO P_305.2026"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1.2,<2.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
